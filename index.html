<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script id="ghMove">if(location.hostname==='tom3games.github.io'){location.replace('https://tom3games.com/play/tail-tag/'+location.search+location.hash)}</script>
<link rel="canonical" href="https://tom3games.com/play/tail-tag/">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>空中しっぽ取り | ワイヤーで飛んで手ぬぐいを奪い合う</title>
<meta name="description" content="ビルや電柱にワイヤーを掛けて飛び回り、CPU 3人と腰の手ぬぐい（しっぽ）を取り合う3Dゲーム。地面にいると光ってばれる。3分で昼から夜へ。スマホのブラウザで無料で遊べる。">
<meta property="og:type" content="website">
<meta property="og:title" content="空中しっぽ取り">
<meta property="og:description" content="ワイヤーで飛んで、腰の手ぬぐいを奪い合う。地面にいると光ってばれる。スマホのブラウザで遊べる。">
<meta property="og:image" content="https://tom3games.com/play/tail-tag/og.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://tom3games.com/play/tail-tag/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#20263f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rampart+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="view"></div>

<!-- タイトル -->
<section id="title" class="screen">
  <div class="title-text">
    <h1 class="logo"><span data-t="logo"></span></h1>
    <p class="sub" data-t="sub"></p>
  </div>
  <div class="level mode-sel" id="modeSel" role="radiogroup">
    <span class="lv-h" data-t="modeHead"></span>
    <button data-md="tag" data-t="modeTag"></button><button data-md="flee" data-t="modeFlee"></button>
  </div>
  <div class="level" id="level" role="radiogroup">
    <span class="lv-h" data-t="lvHead"></span>
    <button data-lv="easy" data-t="lvEasy"></button><button data-lv="normal" data-t="lvNormal"></button><button data-lv="hard" data-t="lvHard"></button>
  </div>
  <div class="title-actions">
    <button id="btnStart" class="go" data-t="start"></button>
    <button id="btnHow" class="text-btn" data-t="how"></button>
  </div>
  <nav class="foot">
    <button id="btnLang" class="mini" data-t="lang"></button>
    <button id="btnMute" class="mini"></button>
    <a class="mini" href="https://tom3games.github.io/" data-t="more"></a>
  </nav>
</section>

<!-- 遊び方 -->
<section id="how" class="screen hidden">
  <div class="sheet">
    <h2 data-t="howTitle"></h2>
    <ol id="howList"></ol>
    <p class="keys" id="howKeys"></p>
    <button class="go small" data-close data-t="ok"></button>
    <p class="credit" data-t="credit"></p>
  </div>
</section>

<!-- 遊び中: 上に物干しロープ（点数）と時計 -->
<canvas id="speedfx"></canvas><div id="hitflash"></div>
<section id="hud" class="hidden">
  <div class="rope-bar">
    <div id="line" class="line"></div>
    <div class="clock" aria-hidden="true">
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#f3efe4" stroke="#2a2a2a" stroke-width="2.5"/><g stroke="#2a2a2a" stroke-width="1.6"><path d="M20 5v3M35 20h-3M20 35v-3M5 20h3"/></g><path id="clockHand" d="M20 20 L20 7" stroke="#c23a2a" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="20" r="2" fill="#2a2a2a"/></svg>
      <b id="clockT">3:00</b>
    </div>
  </div>
  <div id="glowWarn" class="glow-warn hidden" data-t="glowMe"></div>
  <div id="say" class="say hidden"></div>
  <div id="arrow" class="edge-arrow hidden"><svg viewBox="0 0 24 24"><path d="M12 2 L21 20 L12 15 L3 20Z"/></svg><span id="arrowD"></span></div>
  <div id="miss" class="miss hidden"><span>×</span><small data-t="tooFar"></small></div>
  <button id="btnPause" class="corner-btn" aria-label="pause"><svg viewBox="0 0 20 20"><rect x="5" y="4" width="3.4" height="12" rx="1"/><rect x="11.6" y="4" width="3.4" height="12" rx="1"/></svg></button>
  <div id="touch" class="touch hidden">
    <div id="stickZone" class="stickzone"><div id="stick" class="stick"><div class="knob"></div></div></div>
    <button class="tbtn tbig" data-k="wire" aria-label="wire"><svg viewBox="0 0 48 48"><path d="M10 40 36 10" stroke="currentColor" stroke-width="3.5" stroke-linecap="square"/><path d="M26 9h11v11" fill="none" stroke="currentColor" stroke-width="3.5"/></svg></button>
  </div>
</section>

<!-- 一時停止 -->
<section id="pause" class="screen hidden">
  <div class="sheet narrow">
    <h2 data-t="paused"></h2>
    <button id="btnResume" class="go small" data-t="resume"></button>
    <button id="btnQuit" class="text-btn dark" data-t="quit"></button>
  </div>
</section>

<!-- 結果: 表彰台 -->
<section id="result" class="screen hidden">
  <div class="res-wrap">
    <div id="rankBig" class="rank-big"></div>
    <canvas id="podium"></canvas>
    <div class="res-line"><p id="verdict" class="verdict"></p><p id="stats" class="stats"></p></div>
  </div>
  <div class="result-actions">
    <button id="btnAgain" class="go small" data-t="again"></button>
    <div class="row">
      <button id="btnSave" class="mini" data-t="save"></button>
      <a id="btnPost" class="mini" target="_blank" rel="noopener" data-t="post"></a>
      <button id="btnTitle" class="mini" data-t="toTitle"></button>
    </div>
  </div>
</section>

<div id="boot" class="boot" style="--p:0"><div class="bt-scene" aria-hidden="true"><svg class="bt-line" viewBox="0 0 300 120"><path d="M6 20 Q150 48 294 20" fill="none" stroke="#e8e2d2" stroke-width="3"/><g class="bt-tw"><rect x="38" y="30" width="22" height="56" fill="#d8402c"/><rect x="38" y="38" width="22" height="4" fill="#fff" opacity=".85"/><rect x="38" y="76" width="22" height="4" fill="#fff" opacity=".85"/></g><g class="bt-tw"><rect x="98" y="38" width="22" height="56" fill="#2f6fd0"/><rect x="98" y="46" width="22" height="4" fill="#fff" opacity=".85"/><rect x="98" y="84" width="22" height="4" fill="#fff" opacity=".85"/></g><g class="bt-tw"><rect x="168" y="38" width="22" height="56" fill="#e8b021"/><rect x="168" y="46" width="22" height="4" fill="#fff" opacity=".85"/><rect x="168" y="84" width="22" height="4" fill="#fff" opacity=".85"/></g><g class="bt-tw"><rect x="232" y="30" width="22" height="56" fill="#3f9a52"/><rect x="232" y="38" width="22" height="4" fill="#fff" opacity=".85"/><rect x="232" y="76" width="22" height="4" fill="#fff" opacity=".85"/></g></svg></div><p class="bt-msg" data-t="loading">手ぬぐいを干しています</p><div class="bt-bar"><i></i></div></div>

<script>
// 拡大を止める（ピンチ・ダブルタップ・Ctrl+ホイール）。iOS は user-scalable=no を無視するので JS でも止める
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
// 起動失敗の保険
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jsUp) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },9000);
})();
</script>
<script src="sfx.js?v=13"></script>
<script type="module" src="js/game.js?v=12"></script>
<script src="support.js?v=5" data-ja="手ぬぐい" data-en="a towel"></script>
</body>
</html>
